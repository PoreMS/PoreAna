name: Lint

on:
  push:
  pull_request:

jobs:
  ruff:
    name: ruff
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: uv pip install --system ruff
      - name: Lint
        run: ruff check poreana/
      - name: Format check
        run: ruff format --check poreana/

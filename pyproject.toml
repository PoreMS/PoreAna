[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "poreana"
version = "1.0.0"
description = "Pore system analysis tool."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Hamzeh Kraus", email = "kraus@itt.uni-stuttgart.de" }]
requires-python = ">=3.12"
dependencies = ["pandas", "seaborn", "scipy", "chemfiles", "porems>=1.0.0", "jinja2", "h5py>=3.0.0", "pyyaml"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov"]

[project.urls]
Homepage = "https://github.com/PoreMS/PoreAna"

[tool.uv.sources]
porems = { git = "https://github.com/PoreMS/PoreMS.git", branch = "optimization" }

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "W", "I"]

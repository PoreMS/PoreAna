[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poreana"
dynamic = ["version"]
authors = [
    {name = "Hamzeh Kraus", email = "kraus@itt.uni-stuttgart.de"},
    {name = "Marc Högler", email = "hoegler@itt.uni-stuttgart.de"},
    {name = "Karl Prokop", email = "st184141@stud.uni-stuttgart.de"},
]
maintainers = [
    {name = "Marc Högler", email = "hoegler@itt.uni-stuttgart.de"},
    {name = "Karl Prokop", email = "st184141@stud.uni-stuttgart.de"},
]
description = "Pore system analysis tool."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
keywords = [
    "pore",
    "nanopore",
    "molecular dynamics",
    "simulation",
    "analysis",
    "density",
    "diffusion",
    "free energy",
    "GROMACS",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
]
requires-python = ">=3.12"
dependencies = [
    "chemfiles>=0.10,<0.11",
    "h5py>=3.0.0",
    # required by pandas DataFrame.style, used in tables.py and diffusion.py
    "jinja2>=3.1.6",
    "matplotlib>=3.8",
    "numpy>=1.26",
    "pandas>=2.0",
    "porems>=0.3.0",
    "pyyaml>=6.0",
    "scipy>=1.11",
    "seaborn>=0.13",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]
docs = [
    "furo>=2025.12.19",
    "myst-parser>=5.1.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.13.0",
]

[project.urls]
Homepage = "https://github.com/PoreMS/PoreAna"
Repository = "https://github.com/PoreMS/PoreAna"
Documentation = "https://porems.github.io/PoreAna/"
Changelog = "https://github.com/PoreMS/PoreAna/blob/main/CHANGELOG.md"
Issues = "https://github.com/PoreMS/PoreAna/issues"

[tool.pytest.ini_options]
minversion = "6.0"
testpaths = ["tests"]
addopts = "-ra -q"

[tool.coverage.run]
source_pkgs = ["poreana"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "RUF", # ruff-specific rules
]
ignore = []

[tool.ruff.format]
quote-style = "double"

[tool.setuptools.dynamic]
version = {attr = "poreana.__version__"}

[tool.setuptools.packages.find]
include = ["poreana*"]
